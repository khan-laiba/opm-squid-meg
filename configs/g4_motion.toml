# G4 bounded secondary extension: head motion and OPM slippage (NEW). Values are declared study
# choices [C] (docs/provenance_register.md, A-MOT-*); nothing here is a device specification.
# Arrays, noise conventions and placements come from G3B (configs/g3b_pediatric.toml, g2_adult.toml).

anatomies = ["adult", "infant2yr", "infant12mo"]
condition = "intrinsic+brain"            # G3B primary condition

[geometry]
# A. Sustained displacements. Neuromag at the primary G3B placement (top contact): the head moved in
# the fixed helmet (device frame); a position that brings a magnetometer coil closer than 18 mm to the
# scalp is infeasible and skipped (the head cannot move up from top contact).
translations_mm = [2.0, 5.0, 10.0]       # along -z (down), +-x (lateral), +-y (forward/back)
rotations_deg = [5.0, 10.0]              # pitch (device x), roll (y), yaw (z) about the head origin, both signs
# Dense OPM cap slipping on the head: rigid rotation of the array about the head origin, sensors keep
# their axes relative to the cap; a sensor pushed into the scalp is moved out along its axis to the
# A-OPM-CLEAR clearances (the cap can lift, not sink).
slip_deg = [1.0, 3.0]                    # about x, y and z, both signs
floor_db = -60.0                         # a mismatched template with the wrong polarity counts as this loss

[coupling]
# B. In-band motion of the head-mounted array in a static residual field. Linear response per unit
# field (1 nT uniform, or a 1 nT/m symmetric traceless gradient, Frobenius norm), random isotropic
# draws; motion = rotation about a pivot below the head origin (per-axis in-band RMS).
pivot_head_m = [0.0, 0.0, -0.06]         # A-MOT-PIVOT: rotation centre 60 mm below the head origin (head frame)
pivot_sensitivity_m = [0.0, 0.0, 0.0]    # the head origin as the pivot (sensitivity)
n_draws = 32                             # common random numbers: field and calibration draws shared by every case
rotation_rms_deg = [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0]
calibration = [[0.0, 0.0], [1.0, 0.01], [3.0, 0.03]]   # [sensitive-axis RMS tilt deg, gain RMS] (A-MOT-CAL)
loss_db = [1.0, 3.0]                     # report the in-band motion at which the OPM loses this much
seed = 2027

[timecourse]
# Exact rigid motion over a recording (nonlinear check of the linear model; peak field change).
duration_s = 60.0
fs_hz = 300.0
drift_deg = 5.0                          # slow rotation drift (below 0.1 Hz), peak per axis
inband_rotation_rms_deg = 0.05           # in-band (analysis band) rotation jitter, RMS per axis
b0_nT = 2.0
gradient_nT_per_m = 5.0
calibration = [1.0, 0.01]
anatomy = "adult"
seed = 2028                              # its own random stream (trajectory, field and calibration draws)
